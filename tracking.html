<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo dõi đơn hàng - Cafe Việt</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-cafe sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fa-solid fa-mug-saucer me-2"></i>Cafe Việt</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <i class="fa-solid fa-bars fa-lg"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="order.html">Đặt hàng</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Thống kê</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">Giới thiệu</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
        <div id="navUserBox"></div>
        <button id="themeToggleBtn" class="theme-toggle-btn" title="Chuyển giao diện sáng/tối"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </div>
</nav>

<div class="container my-4" style="max-width:760px;">
  <span class="section-label mb-2">Theo dõi đơn hàng</span>
  <h2 class="mb-4" id="trackOrderTitle">Đơn hàng #--</h2>

  <div id="trackNotFound" class="empty-state d-none">
    <i class="fa-solid fa-circle-question"></i>
    <h5>Không tìm thấy đơn hàng</h5>
    <p class="mb-3">Đơn hàng này không tồn tại hoặc đã bị xóa.</p>
    <a href="order.html" class="btn btn-brand btn-pill">Về trang đặt hàng</a>
  </div>

  <div id="trackContent" class="d-none">
    <div class="cafe-card p-4 mb-4">
      <div class="tracking-stepper" id="trackingStepper"></div>
      <div class="text-center mt-4">
        <span class="badge rounded-pill px-3 py-2" id="trackStatusBadge" style="background:var(--accent-soft); color:var(--brand); font-size:1rem;"></span>
        <p class="text-muted small mt-2 mb-0" id="trackEta"></p>
      </div>
    </div>

    <div class="cafe-card p-4">
      <h5 class="mb-3"><i class="fa-solid fa-receipt me-2"></i>Chi tiết đơn hàng</h5>
      <div id="trackItemsList" class="mb-3"></div>
      <hr>
      <div class="d-flex justify-content-between small mb-1"><span class="text-muted">Tạm tính</span><span id="trackSubtotal"></span></div>
      <div class="d-flex justify-content-between small mb-1"><span class="text-muted">Phí giao hàng</span><span id="trackShipping"></span></div>
      <div class="d-flex justify-content-between small mb-1 text-success" id="trackDiscountRow"><span>Giảm giá</span><span id="trackDiscount"></span></div>
      <div class="d-flex justify-content-between fs-5 fw-bold mt-2"><span>Tổng cộng</span><span style="color:var(--brand)" id="trackTotal"></span></div>
      <hr>
      <div class="text-muted small" id="trackMeta"></div>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/menuService.js"></script>
<script src="assets/js/orderService.js"></script>
<script src="assets/js/customerService.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/cartWidget.js"></script>
<script src="assets/js/chatbot.js"></script>
<script src="assets/js/tracking.js"></script>
</body>
</html>
